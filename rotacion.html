<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotación Agua</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .turno-actual {
            background: #e3f2fd;
            border: 3px solid #2196f3;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .turno-actual p {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .turno-actual .nombre {
            font-size: 32px;
            font-weight: bold;
            color: #2196f3;
        }

        .acciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-copiar {
            background: #4caf50;
            color: white;
        }

        .btn-copiar:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .btn-pagado {
            background: #2196f3;
            color: white;
        }

        .btn-pagado:hover {
            background: #1976d2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
        }

        .btn-teams {
            background: #0078d4;
            color: white;
        }

        .btn-teams:hover {
            background: #005a9e;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 120, 212, 0.3);
        }

        .lista {
            margin-bottom: 30px;
        }

        .lista h3 {
            font-size: 16px;
            color: #666;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .usuario-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-left: 4px solid #ddd;
            border-radius: 4px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .usuario-item.activo {
            background: #f5f5f5;
            border-left-color: #999;
        }

        .usuario-item.activo.turno {
            background: #e3f2fd;
            border-left-color: #2196f3;
            font-weight: bold;
        }

        .usuario-item.inactivo {
            background: #f0f0f0;
            color: #999;
            border-left-color: #ccc;
            text-decoration: line-through;
        }

        .posicion {
            font-weight: bold;
            color: #666;
            min-width: 30px;
        }

        .nombre-usuario {
            flex: 1;
            margin-left: 12px;
        }

        .estado {
            font-size: 12px;
            color: #999;
            font-weight: normal;
        }

        .btn-toggle {
            padding: 4px 8px;
            font-size: 12px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-toggle:hover {
            background: #f57c00;
        }

        .stats {
            background: #fafafa;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }

        .input-precio {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2196f3;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .turno-actual .nombre {
                font-size: 24px;
            }

            .acciones {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💧 Rotación Agua</h1>

        <div id="contenido">
            <div class="loading">
                <div class="spinner"></div>
                Cargando datos...
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jcwjdcxofzczmpzamcuc.supabase.co'
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impjd2pkY3hvZnpjem1wemFtY3VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNTMzNDksImV4cCI6MjA5OTYyOTM0OX0.eekJCgUQaqHmwou6gXkwb4_wShLNE-32K_ZQtzI-FRw'

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

        let usuarios = []
        let turnoIndex = 0

        async function inicializar() {
            try {
                const { data, error } = await supabaseClient
                    .from('usuarios')
                    .select('*')
                    .order('posicion', { ascending: true })

                if (error) throw error

                usuarios = data || []
                encontrarTurno()
                render()

            } catch (err) {
                console.error('Error:', err)
                document.getElementById('contenido').innerHTML = 
                    `<div class="loading" style="color: red;">Error: ${err.message}</div>`
            }
        }

        function encontrarTurno() {
            const siguiente = usuarios.find(u => u.activo)
            if (siguiente) {
                turnoIndex = usuarios.indexOf(siguiente)
            }
        }

        async function recargar() {
            const { data, error } = await supabaseClient
                .from('usuarios')
                .select('*')
                .order('posicion', { ascending: true })

            if (!error) {
                usuarios = data || []
                encontrarTurno()
                render()
            }
        }

        function copiarNombre() {
            const turno = usuarios[turnoIndex]
            navigator.clipboard.writeText(turno.nombre).then(() => {
                alert(`✓ "${turno.nombre}" copiado`)
            })
        }

        function abrirTeams() {
            window.open('ms-teams://')
        }

        function copiarRecordatorio() {
            const turno = usuarios[turnoIndex]
            const precio = document.getElementById('inputPrecio').value || '3500'
            const texto = `${turno.nombre}, te toca comprar agua.\nSon ${precio} colones (o lo que cueste).\n¡Gracias!`
            navigator.clipboard.writeText(texto).then(() => {
                alert('✓ Recordatorio copiado')
            })
        }

        async function marcarPagado() {
            const turno = usuarios[turnoIndex]
            const precio = parseInt(document.getElementById('inputPrecio').value) || 3500

            try {
                const { error: errorPago } = await supabaseClient
                    .from('pagos')
                    .insert([{
                        usuario_id: turno.id,
                        precio_pagado: precio,
                        fecha_pago: new Date().toISOString()
                    }])

                if (errorPago) throw errorPago

                turnoIndex++
                if (turnoIndex >= usuarios.length) {
                    turnoIndex = 0
                }
                
                while (turnoIndex < usuarios.length && !usuarios[turnoIndex].activo) {
                    turnoIndex++
                }
                if (turnoIndex >= usuarios.length) {
                    turnoIndex = 0
                    while (turnoIndex < usuarios.length && !usuarios[turnoIndex].activo) {
                        turnoIndex++
                    }
                }

                alert(`✓ ${turno.nombre} marcado como pagado`)
                recargar()

            } catch (err) {
                alert('Error: ' + err.message)
            }
        }

        async function toggleActivo(index) {
            try {
                const usuario = usuarios[index]
                const { error } = await supabaseClient
                    .from('usuarios')
                    .update({ activo: !usuario.activo })
                    .eq('id', usuario.id)

                if (error) throw error
                recargar()

            } catch (err) {
                alert('Error: ' + err.message)
            }
        }

        function render() {
            const turno = usuarios[turnoIndex]

            const listaHTML = usuarios.map((usuario, i) => {
                const estado = usuario.activo ? 'activo' : 'inactivo'
                const esTurno = i === turnoIndex ? 'turno' : ''
                const labelActivo = usuario.activo ? '(Desactivar)' : '(Activar)'

                return `
                    <div class="usuario-item ${estado} ${esTurno}">
                        <span class="posicion">${usuario.posicion}.</span>
                        <div class="nombre-usuario">
                            ${usuario.nombre}
                            ${!usuario.activo ? '<span class="estado"> inactivo</span>' : ''}
                        </div>
                        <button class="btn-toggle" onclick="toggleActivo(${i})">${labelActivo}</button>
                    </div>
                `
            }).join('')

            const activos = usuarios.filter(u => u.activo).length

            document.getElementById('contenido').innerHTML = `
                <div class="turno-actual">
                    <p>Siguiente a pagar:</p>
                    <div class="nombre">${turno.nombre}</div>
                </div>

                <input type="number" class="input-precio" id="inputPrecio" placeholder="Precio pagado (ej: 3500)" value="3500">

                <div class="acciones">
                    <button class="btn-copiar" onclick="copiarNombre()">👤 Copiar nombre</button>
                    <button class="btn-copiar btn-teams" onclick="abrirTeams()">🔵 Abrir Teams</button>
                </div>

                <div class="acciones">
                    <button class="btn-copiar" onclick="copiarRecordatorio()">📋 Copiar recordatorio</button>
                    <button class="btn-pagado" onclick="marcarPagado()">✓ Marcar pagado</button>
                </div>

                <div class="lista">
                    <h3>Orden de rotación</h3>
                    <div id="listaUsuarios">${listaHTML}</div>
                </div>

                <div class="stats">
                    Total: ${usuarios.length} | Activos: ${activos}
                </div>
            `
        }

        inicializar()
    </script>
</body>
</html>
